name: Verificações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar o projeto e as ferramentas
        run: python -m pip install -e ".[dev]"

      - name: Testes (pytest)
        run: python -m pytest

      - name: Erros e estilo (ruff check)
        run: python -m ruff check .

      - name: Formatação (ruff format)
        run: python -m ruff format --check .

      - name: Trava de privacidade
        run: python -m monitor_normas.trava_privacidade

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Busca de senhas e chaves (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
